[package]
name = "vellum-adapter-semantic-helper-xpc-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "One-attempt signed NSXPC client adapter for Vellum semantic helpers"
build = "build.rs"

[dependencies]
vellum-semantic-helper-protocol = { version = "=0.1.0", path = "../../../vellum/protocol/vellum-semantic-helper-protocol" }
